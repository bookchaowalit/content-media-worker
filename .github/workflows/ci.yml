# CI + security baseline (DevSecOps Phase 1). Public repository: GitHub-hosted runners.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-node.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      node-version: "22" # engines.node >= 22; the Dockerfile uses node:22-slim
      require-tests: true # ADR-0004: fail if the test script disappears
      # No Biome/ESLint config yet: lint is skipped by `auto` with a warning. Typecheck runs the
      # `typecheck` script (tsc --noEmit, strict), tests run `npm test` (node --test via tsx; no
      # coverage gate because the shared gate needs vitest or jest), and both bundles build.
      build-command: npm run build

  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@493a7f5c322219e61245cf17f1fa34de2c35a22b # v1.6.6

  image:
    # Builds the Dockerfile and scans the image with Trivy (packages inside the image, which the
    # Trivy fs scan cannot see). Blocking: a fixable HIGH/CRITICAL finding fails CI (and so Railway's Wait for CI).
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/image-scan.yml@b9957cccb3cc202e9e1a08df01924b8270d796df # v1.6.3
