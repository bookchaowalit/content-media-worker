# CI + security baseline (DevSecOps Phase 1). Public repository: GitHub-hosted runners.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-node.yml@c37ef9d113eefb3ed45429717cb7ca201192c3fc # v1.0.1
    with:
      node-version: "22" # engines.node >= 22; the Dockerfile uses node:22-slim
      # No Biome/ESLint config or tsconfig.json yet: lint and typecheck are skipped by `auto`
      # with a warning. Tests run (`npm test`), and both bundles (Node and Cloudflare) build.
      build-command: npm run build

  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@c37ef9d113eefb3ed45429717cb7ca201192c3fc # v1.0.1
