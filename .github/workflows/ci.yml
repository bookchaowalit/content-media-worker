# CI + security baseline (DevSecOps Phase 1). Public repository: GitHub-hosted runners.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-node.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      node-version: "22" # engines.node >= 22; the Dockerfile uses node:22-slim
      require-tests: true # ADR-0004: fail if the test script disappears
      # No Biome/ESLint config yet: lint is skipped by `auto` with a warning. Typecheck runs the
      # `typecheck` script (tsc --noEmit, strict), tests run `npm test` (node --test via tsx; no
      # coverage gate because the shared gate needs vitest or jest), and both bundles build.
      build-command: npm run build

  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
